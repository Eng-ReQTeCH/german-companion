services:
  wort:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - wort-data:/app/data
    restart: unless-stopped
    environment:
      - PORT=3000
      - TTS_URL=http://piper:5002/synthesize
    depends_on:
      piper:
        condition: service_healthy
  piper:
    build:
      context: .
      dockerfile: tts/Dockerfile
    restart: unless-stopped
volumes:
  wort-data:
