services:
  wort:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - wort-data:/app/data
    restart: unless-stopped
    environment:
      - PORT=3000
      - TTS_URL=http://piper:5002/synthesize
      - EPISUITE_URL=${EPISUITE_URL:-}
      - EPISUITE_TASK_TITLE=${EPISUITE_TASK_TITLE:-Study German}
      - EPISUITE_TASK_ID=${EPISUITE_TASK_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      piper:
        condition: service_healthy
  piper:
    build:
      context: .
      dockerfile: tts/Dockerfile
    restart: unless-stopped
volumes:
  wort-data:
